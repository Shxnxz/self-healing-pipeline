name: self-healing-pipeline

services:
  # --- Broker -----------------------------------------------------------
  kafka:
    image: apache/kafka:latest
    container_name: kafka
    ports:
      - "9092:9092" # internal / inter-container listener
      - "29092:29092" # host-facing listener, for tools running outside docker
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list" ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  # --- Observability ------------------------------------------------------
  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  # --- Producer -------------------------------------------------------
  # Replays partitioned CSV tables as live feeds into Kafka.
  producer:
    build: ./producer
    container_name: producer
    volumes:
      - ./data:/data:ro
    environment:
      DATA_DIR: /data
      # Must match SOURCES on the Spark jobs below (same folders, lower-cased).
      TABLES: ${TABLES:-Crash1,Crash2,Crash3,Crash4}
      CSV_FILES: ${CSV_FILES:-}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC_PREFIX: crashes
      TOPIC_PER_TABLE: "true"
      BATCH_SIZE: "50"
      BATCH_INTERVAL_SECONDS: "3"
      LOOP_FOREVER: "false"
      STREAMING_MODE: "interleaved"
    depends_on:
      kafka:
        condition: service_healthy

  # --- Bronze + Silver 1 -------------------------------------------
  # One Spark driver, one query per layer per source (spark-jobs/sources.py),
  # so 8 queries with the 4 default sources:
  #   crashes.crashN -> bronze_crashN    untouched raw landing
  #   bronze_crashN  -> silver1_crashN   parsed/cleaned via SILVER1_TRANSFORM_SQL
  bronze-silver1-job:
    build: ./spark-jobs
    container_name: bronze-silver1-job
    command: [ "python", "run_layers.py", "bronze", "silver1" ]
    restart: on-failure
    volumes:
      - ./spark-jobs:/app
      - ./qwen_classifier:/app/qwen_classifier:ro
      - ./incidents:/data/incidents
      - ./delta:/data/delta
      - ./checkpoints:/data/checkpoints
      - ivy-cache:/root/.ivy2
    environment:
      QWEN_ENABLED: ${QWEN_ENABLED:-false}
      QWEN_BASE_URL: ${QWEN_BASE_URL:-http://host.docker.internal:11434}
      QWEN_MODEL: ${QWEN_MODEL:-qwen3:4b-instruct}
      QWEN_INCIDENT_DIR: /data/incidents
      QWEN_KAFKA_ENABLED: ${QWEN_KAFKA_ENABLED:-false}
      QWEN_INCIDENT_TOPIC: ${QWEN_INCIDENT_TOPIC:-recovery.incidents}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      OPENLINEAGE_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      OPENLINEAGE_TOPIC: openlineage.events
      # One branch per data folder; topic crashes.<source>, tables <layer>_<source>.
      SOURCES: ${SOURCES:-crash1,crash2,crash3,crash4}
      DELTA_ROOT: /data/delta
      CHECKPOINT_ROOT: /data/checkpoints
      SPARK_DRIVER_MEMORY: ${BRONZE_SILVER1_DRIVER_MEMORY:-1g}
      SPARK_SHUFFLE_PARTITIONS: "8"
      SILVER1_TXN_APP_ID: ${SILVER1_TXN_APP_ID:-silver1}
      SILVER1_OPTIONAL_COLUMNS: ${SILVER1_OPTIONAL_COLUMNS:-[]}
    depends_on:
      kafka:
        condition: service_healthy

  # --- Silver 2 + Gold ----------------------------------------------
  # One Spark driver, 5 queries with the 4 default sources:
  #   silver1_crashN -> silver2_crashN   canonical lookups & parsing chains (one per source;
  #                                      failures -> the shared silver2_quarantine)
  #   silver2_crash1..4 -> gold          UNION ALL, business-ready fields via GOLD_TRANSFORM_SQL
  # 2g driver: the four Silver 2 queries each cache their micro-batch at the same time.
  silver2-gold-job:
    build: ./spark-jobs
    container_name: silver2-gold-job
    command: [ "python", "run_layers.py", "silver2", "gold" ]
    restart: on-failure
    volumes:
      - ./spark-jobs:/app
      - ./qwen_classifier:/app/qwen_classifier:ro
      - ./incidents:/data/incidents
      - ./delta:/data/delta
      - ./checkpoints:/data/checkpoints
      - ivy-cache:/root/.ivy2
    environment:
      QWEN_ENABLED: ${QWEN_ENABLED:-false}
      QWEN_BASE_URL: ${QWEN_BASE_URL:-http://host.docker.internal:11434}
      QWEN_MODEL: ${QWEN_MODEL:-qwen3:4b-instruct}
      QWEN_INCIDENT_DIR: /data/incidents
      QWEN_KAFKA_ENABLED: ${QWEN_KAFKA_ENABLED:-false}
      QWEN_INCIDENT_TOPIC: ${QWEN_INCIDENT_TOPIC:-recovery.incidents}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SOURCES: ${SOURCES:-crash1,crash2,crash3,crash4}
      # Sources whose slash dates are dd/MM/yyyy (Crash3); the rest read MM/dd/yyyy.
      DAY_FIRST_SOURCES: ${DAY_FIRST_SOURCES:-crash3}
      DELTA_ROOT: /data/delta
      CHECKPOINT_ROOT: /data/checkpoints
      SPARK_DRIVER_MEMORY: ${SILVER2_GOLD_DRIVER_MEMORY:-2g}
      SPARK_SHUFFLE_PARTITIONS: "8"
      QUARANTINE_PATH: /data/delta/silver2_quarantine
      DEAD_LETTER_PATH: /data/delta/silver2_dead_letter
      REF_MAPPINGS_PATH: /data/delta/ref_canonical_mappings
      FUZZY_AUDIT_PATH: /data/delta/silver2_fuzzy_audit
      GOLD_PATH: /data/delta/gold
      GOLD_CHECKPOINT_PATH: /data/checkpoints/gold
      OPENLINEAGE_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      OPENLINEAGE_TOPIC: openlineage.events
    depends_on:
      bronze-silver1-job:
        condition: service_started
      kafka:
        condition: service_healthy

  # --- Knowledge graph -----------------------------------------------
  # Lineage metadata (OpenLineage) and the incident corpus (vector index).
  # Browser: http://localhost:7474   Bolt: bolt://localhost:7687
  neo4j:
    image: neo4j:5.26-community
    container_name: neo4j
    ports:
      - "7474:7474" # HTTP browser
      - "7687:7687" # Bolt
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-selfhealing}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      test: [ "CMD-SHELL", "cypher-shell -u neo4j -p '${NEO4J_PASSWORD:-selfhealing}' 'RETURN 1' || exit 1" ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  # One-shot: applies lineage/schema.cypher (idempotent) and exits.
  neo4j-init:
    image: neo4j:5.26-community
    container_name: neo4j-init
    restart: "no"
    entrypoint: [ "sh", "-c", "cypher-shell -a bolt://neo4j:7687 -u neo4j -p '${NEO4J_PASSWORD:-selfhealing}' -f /schema/schema.cypher" ]
    volumes:
      - ./lineage/schema.cypher:/schema/schema.cypher:ro
    depends_on:
      neo4j:
        condition: service_healthy

  # Reads the OpenLineage events the Spark jobs publish to Kafka and writes the
  # pipeline lineage graph (jobs, runs, tables, schema versions) into Neo4j.
  lineage-consumer:
    build: ./lineage
    container_name: lineage-consumer
    restart: on-failure
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      OPENLINEAGE_TOPIC: openlineage.events
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-selfhealing}
    depends_on:
      kafka:
        condition: service_healthy
      neo4j-init:
        condition: service_completed_successfully

  # --- Deterministic Lookup ---------------------------------------------
  # Groups new silver2_quarantine rows and publishes them to recovery.failures.
  lookup-scanner:
    build:
      context: .
      dockerfile: lookup/Dockerfile
    container_name: lookup-scanner
    command: [ "python", "scanner.py" ]
    restart: on-failure
    volumes:
      - ./delta:/data/delta:ro
      - lookup-state:/state
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      QUARANTINE_PATH: /data/delta/silver2_quarantine
      QUARANTINE_FAILURE_TOPIC: recovery.failures
      SCANNER_STATE_PATH: /state/quarantine_scanner.json
    depends_on:
      kafka:
        condition: service_healthy

  # Consumes recovery.incidents (Qwen, needs QWEN_KAFKA_ENABLED=true) and
  # recovery.failures, computes blast radius + incident pattern from Neo4j and
  # publishes a ranked stack to recovery.lookup. See lookup/README.md.
  deterministic-lookup:
    build:
      context: .
      dockerfile: lookup/Dockerfile
    container_name: deterministic-lookup
    command: [ "python", "consumer.py" ]
    restart: on-failure
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      QWEN_INCIDENT_TOPIC: ${QWEN_INCIDENT_TOPIC:-recovery.incidents}
      QUARANTINE_FAILURE_TOPIC: recovery.failures
      LOOKUP_OUTPUT_TOPIC: recovery.lookup
      LOOKUP_WINDOW_SECONDS: ${LOOKUP_WINDOW_SECONDS:-10}
      LOOKUP_SIMILARITY_THRESHOLD: ${LOOKUP_SIMILARITY_THRESHOLD:-0.85}
      LOOKUP_EMBED_MODEL: ${LOOKUP_EMBED_MODEL:-}
      LOOKUP_EMBED_BASE_URL: ${LOOKUP_EMBED_BASE_URL:-http://host.docker.internal:11434}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-selfhealing}
    depends_on:
      kafka:
        condition: service_healthy
      neo4j-init:
        condition: service_completed_successfully

  # --- Recovery agent (LangGraph loop) -----------------------------------
  # Consumes recovery.lookup and runs one LangGraph workflow per failure:
  # deterministic lookup -> diagnose -> policy gate -> remediate -> validate ->
  # escalate / learn. Diagnose asks the reasoning model (Qwen on Ollama), the policy
  # gate decides whether its proposal may run, Remediate stages the fix and writes the
  # audit record, and Validate replays the staged records through Silver 2's own code
  # (a small local Spark session) and releases the ones that pass into Silver 2.
  # Escalate and Learn are still stubs. See agent/README.md.
  recovery-agent:
    build:
      context: .
      dockerfile: agent/Dockerfile
    container_name: recovery-agent
    restart: on-failure
    volumes:
      - agent-state:/state
      # The pipeline's tables. The agent writes three kinds: delta/remediation_audit
      # (Remediate), the healed rows appended to silver2_<source> and their quarantine
      # rows marked RESOLVED (Validate). Everything else it only reads.
      - ./delta:/data/delta
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      LOOKUP_OUTPUT_TOPIC: recovery.lookup
      AGENT_CHECKPOINT_PATH: /state/recovery_checkpoints.sqlite
      DELTA_ROOT: /data/delta
      REF_MAPPINGS_PATH: /data/delta/ref_canonical_mappings
      QUARANTINE_PATH: /data/delta/silver2_quarantine
      REMEDIATION_AUDIT_PATH: /data/delta/remediation_audit
      # Must match the Silver 2 job: Validate re-reads each source's dates in its own order.
      DAY_FIRST_SOURCES: ${DAY_FIRST_SOURCES:-crash3}
      VALIDATE_SPARK_DRIVER_MEMORY: ${VALIDATE_SPARK_DRIVER_MEMORY:-512m}
      DIAGNOSE_MODEL: ${DIAGNOSE_MODEL:-qwen3:8b}
      DIAGNOSE_BASE_URL: ${DIAGNOSE_BASE_URL:-http://host.docker.internal:11434}
      DIAGNOSE_THINK: ${DIAGNOSE_THINK:-false}
      POLICY_CONFIDENCE_THRESHOLD: ${POLICY_CONFIDENCE_THRESHOLD:-0.85}
      POLICY_UNVERIFIED_CONFIDENCE_THRESHOLD: ${POLICY_UNVERIFIED_CONFIDENCE_THRESHOLD:-}
      POLICY_SAFE_ACTIONS: ${POLICY_SAFE_ACTIONS:-}
    depends_on:
      kafka:
        condition: service_healthy

volumes:
  ivy-cache:
  neo4j-data:
  neo4j-logs:
  lookup-state:
  agent-state:
